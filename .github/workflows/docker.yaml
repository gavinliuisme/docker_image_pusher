name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'version.txt'
      - 'README.md'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  DOCKER_CLIENT_TIMEOUT: 120
  COMPOSE_HTTP_TIMEOUT: 120

permissions:
  contents: write
  actions: write      # 清理历史 workflow runs 需要 actions: write 权限

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    # ============================================================
    # 前置清理：清掉上次运行遗留的 docker / buildx / containerd 资源
    # 关键：docker system prune 只能清 /var/lib/docker，清不到 /var/lib/containerd。
    # 新版 Docker（25+）默认启用 containerd-snapshotter，镜像层实际写在
    # /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/ 下，
    # 必须显式清理这里，否则多跑几次会累积出 GB 级残留。
    # 注：已不使用 easimon/maximize-build-space —— 它把 /var/lib/docker 挂到大分区，
    # 但 /var/lib/containerd 仍留在被缩小的小根分区上，docker pull 解压层时必然爆盘。
    # 直接用 ubuntu-latest 自带的 ~84 GB 单根分区即可。
    # ============================================================
    - name: Cleanup docker / buildx / containerd before run
      run: |
        echo "清理上次运行遗留的 docker / buildx / containerd 资源..."
        # 1. 清理所有 buildx builder（停掉 buildkit 容器，释放 containerd 空间）
        docker buildx ls || true
        docker buildx rm --all-inactive 2>/dev/null || true
        docker buildx prune -af --all || true
        docker builder prune -af --all || true
        # 2. 清理 docker 镜像/卷/网络
        docker system prune -af --volumes || true
        # 3. 如果 /var/lib/containerd 还有大残留，手动清掉 buildkit 快照
        if [ -d /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots ]; then
          sudo rm -rf /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/* 2>/dev/null || true
        fi
        if [ -d /var/lib/docker/buildkit ]; then
          sudo rm -rf /var/lib/docker/buildkit/* 2>/dev/null || true
        fi
        echo "清理完成，当前磁盘空间："
        df -hT /
        echo "==== docker / containerd 目录占用 ===="
        sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true

    - name: Disk space check (start)
      run: |
        echo "==== 起始磁盘空间（不使用 maximize-build-space，直接吃 ubuntu-latest 自带 ~84 GB 根分区）===="
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="
        echo "==== docker / containerd 目录占用 ===="
        sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true
        echo "==== Docker info ===="
        docker info --format 'Storage Driver: {{.Driver}}{{"\n"}}Docker Root Dir: {{.DockerRootDir}}{{"\n"}}Containerd Snapshotter: {{.ExperimentalBuild}}' 2>/dev/null || docker info 2>/dev/null | head -50

    - name: Checkout Code
      uses: actions/checkout@v4

    # 注：原 workflow 里有 docker/setup-buildx-action@v3，但脚本全程用
    # docker pull / docker tag / docker push / docker manifest inspect，
    # 根本用不到 buildx。setup-buildx-action 会启动一个 buildkit 容器，
    # 反而把 /var/lib/containerd 撑爆（解压 buildctl 时报 no space left on device）。
    # 已删除 buildx 步骤。

    - name: Login to Aliyun Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.ALIYUN_REGISTRY }}
        username: ${{ secrets.ALIYUN_REGISTRY_USER }}
        password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

    - name: Disk space after login
      run: |
        echo "==== Login 完成，开始同步前磁盘空间 ===="
        df -hT /

    - name: Build and push image Aliyun
      run: |
        set -e

        # --- 1. 定义重试函数 ---
        function retry_command() {
            local max_attempts=$1
            local delay=$2
            local cmd="${@:3}"
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
                echo "正在执行 (尝试 $attempt/$max_attempts): $cmd"
                if eval "$cmd"; then
                    return 0
                else
                    echo "命令执行失败。"
                    if [ $attempt -lt $max_attempts ]; then
                        echo "等待 ${delay} 秒后重试..."
                        sleep $delay
                    fi
                fi
                ((attempt++))
            done
            echo "命令在 $max_attempts 次尝试后依然失败: $cmd"
            return 1
        }

        # --- 2. 定义获取远程镜像 Digest 的函数 ---
        function get_remote_digest() {
            local image=$1
            local platform=$2
            local digest=""

            if [ -z "$platform" ]; then
                platform="linux/amd64"
            fi

            local os=$(echo "$platform" | cut -d'/' -f1)
            local arch=$(echo "$platform" | cut -d'/' -f2)

            local inspect_output
            inspect_output=$(docker manifest inspect --verbose "$image" 2>/dev/null)

            if [ $? -eq 0 ]; then
                digest=$(echo "$inspect_output" | jq -r --arg os "$os" --arg arch "$arch" \
                    '.[] | select(.Descriptor.platform.os==$os and .Descriptor.platform.architecture==$arch) | .Descriptor.digest' | head -n 1)

                if [ -z "$digest" ]; then
                    digest=$(echo "$inspect_output" | jq -r '.[0].Descriptor.digest // empty' 2>/dev/null)
                fi
                if [ -z "$digest" ]; then
                     digest=$(echo "$inspect_output" | jq -r '.Descriptor.digest // empty' 2>/dev/null)
                fi
            fi
            echo "$digest"
        }

        # --- 3. 初始化数据 ---
        VERSION_FILE="version.txt"
        declare -A version_map
        declare -a ordered_keys

        if [ -f "$VERSION_FILE" ]; then
            echo "读取历史版本记录 $VERSION_FILE ..."
            while IFS="=" read -r key val; do
                [[ -z "$key" ]] && continue
                version_map["$key"]="$val"
            done < "$VERSION_FILE"
        else
            echo "未找到 $VERSION_FILE，将创建新文件。"
        fi

        HAS_UPDATE=0
        TOTAL_IMAGES=0
        CURRENT_NUM=0
        UPDATED_IMAGES=""
        INVALID_IMAGES=""   # <-- 新增：记录失效的镜像名

        # --- 4. 第一遍循环：检测重名镜像 ---
        declare -A duplicate_images
        declare -A temp_map

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then continue; fi
            TOTAL_IMAGES=$((TOTAL_IMAGES+1))

            image=$(echo "$line" | tr ' ' '\n' | grep -v '^--' | head -n 1)
            if [[ -z "$image" ]]; then continue; fi
            image="${image%%@*}"

            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_key="${name_space}_"

            if [[ -n "${temp_map[$image_name]}" ]]; then
                 if [[ "${temp_map[$image_name]}" != "${name_space_key}" ]]; then
                    duplicate_images[$image_name]="true"
                 fi
            else
                temp_map[$image_name]="${name_space_key}"
            fi
        done < images.txt


        # --- 5. 第二遍循环：对比、同步、记录顺序 ---
        # 周期性彻底清理的间隔：每同步 N 个镜像做一次 docker system prune -af
        # 防止大镜像（clouddrive2、firefox、hivision_idphotos 等）层堆积把磁盘撑爆。
        PRUNE_EVERY=10
        SYNCED_SINCE_LAST_PRUNE=0

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then continue; fi
            CURRENT_NUM=$((CURRENT_NUM+1))

            platform=""
            if [[ "$line" == *"--platform"* ]]; then
                platform=$(echo "$line" | grep -oP '(?<=--platform[ =])[^\s]+')
            fi

            image=$(echo "$line" | tr ' ' '\n' | grep -v '^--' | head -n 1)

            inspect_platform=$platform
            if [ -z "$inspect_platform" ]; then
                inspect_platform="linux/amd64"
            fi

            map_key="$image"

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi

            image_name_tag_no_digest="${image_name_tag%%@*}"

            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag_no_digest"

            ordered_keys+=("$map_key")

            echo "=============================================================================="
            echo "检查镜像: $image ($CURRENT_NUM/$TOTAL_IMAGES)"
            echo "目标名称: $new_image"
            echo "记录Key : $map_key"

            source_digest=$(get_remote_digest "$image" "$inspect_platform")

            if [ -z "$source_digest" ]; then
                echo "警告: 无法获取源镜像指纹，将强制尝试同步。"
            fi

            local_record="${version_map[$map_key]}"

            if [ -n "$source_digest" ] && [ "$source_digest" == "$local_record" ]; then
                echo ">>> 本地记录匹配 (Digest: $source_digest)，跳过同步。"
                continue
            fi

            echo ">>> 发现更新 (本地: $local_record vs 远程: $source_digest)，开始同步..."

            if [ -z "$platform" ]; then
                pull_cmd="docker pull $image"
            else
                pull_cmd="docker pull --platform $platform $image"
            fi

            # --- 拉取镜像，失败则记录并跳过 ---
            if ! retry_command 3 5 "$pull_cmd"; then
                echo ">>> 镜像拉取失败，标记为失效镜像并跳过: $image"
                if [ -n "$INVALID_IMAGES" ]; then
                    INVALID_IMAGES="$INVALID_IMAGES, $image"
                else
                    INVALID_IMAGES="$image"
                fi
                continue
            fi

            # --- 打 tag 失败也按失效处理 ---
            if ! docker tag "$image" "$new_image"; then
                echo ">>> docker tag 失败，标记为失效镜像并跳过: $image"
                if [ -n "$INVALID_IMAGES" ]; then
                    INVALID_IMAGES="$INVALID_IMAGES, $image"
                else
                    INVALID_IMAGES="$image"
                fi
                docker rmi "$image" 2>/dev/null || true
                continue
            fi

            # --- 推送镜像，失败则记录并跳过 ---
            if ! retry_command 3 10 "docker push $new_image"; then
                echo ">>> 镜像推送失败，标记为失效镜像并跳过: $image"
                if [ -n "$INVALID_IMAGES" ]; then
                    INVALID_IMAGES="$INVALID_IMAGES, $image"
                else
                    INVALID_IMAGES="$image"
                fi
                docker rmi "$image" "$new_image" 2>/dev/null || true
                continue
            fi

            if [ -n "$source_digest" ]; then
                version_map["$map_key"]="$source_digest"
                HAS_UPDATE=1
                if [ -n "$UPDATED_IMAGES" ]; then
                    UPDATED_IMAGES="$UPDATED_IMAGES, $image"
                else
                    UPDATED_IMAGES="$image"
                fi
            else
                echo ">>> 由于未获取到指纹，未更新 version.txt 记录。"
            fi

            # ============================================================
            # 方案 B：推完即删 + 立刻清悬空层
            # docker image prune -f 会清掉 dangling 层，避免多镜像时层堆积。
            # 注意只清 dangling（-f），不清所有（-af 会把还在用的也清掉）。
            # ============================================================
            docker rmi "$image" "$new_image" 2>/dev/null || true
            docker image prune -f 2>/dev/null || true

            # ============================================================
            # 周期性彻底清理：每同步 PRUNE_EVERY 个镜像做一次 system prune -af
            # 把 buildkit 缓存、未被引用的中间层一并清掉，控制大镜像列表的峰值占用。
            # 注意：这里只对"实际同步过的镜像"计数，跳过的镜像不计入。
            # ============================================================
            SYNCED_SINCE_LAST_PRUNE=$((SYNCED_SINCE_LAST_PRUNE+1))
            if [ $((SYNCED_SINCE_LAST_PRUNE % PRUNE_EVERY)) -eq 0 ]; then
                echo ">>> 已连续同步 $SYNCED_SINCE_LAST_PRUNE 个镜像，执行一次彻底清理..."
                docker system prune -af 2>/dev/null || true
                docker builder prune -af 2>/dev/null || true
                SYNCED_SINCE_LAST_PRUNE=0
                echo ">>> 清理完成，当前磁盘空间："
                df -hT /
            fi

        done < images.txt

        # ============================================================
        # 循环结束后兜底：再做一次彻底清理，防止 commit 之前磁盘仍有残留
        # ============================================================
        docker image prune -af 2>/dev/null || true
        docker builder prune -af 2>/dev/null || true

        # --- 6. 输出失效镜像汇总 ---
        echo "=============================================================================="
        if [ -n "$INVALID_IMAGES" ]; then
            echo "以下镜像同步失败（已记录为失效，本次跳过）:"
            echo "$INVALID_IMAGES" | tr ',' '\n' | sed 's/^ *//'
        else
            echo "无失效镜像。"
        fi
        echo "=============================================================================="

        # --- 7. 更新 version.txt 文件 ---
        if [ "$HAS_UPDATE" -eq 1 ] || [ ! -f "$VERSION_FILE" ]; then
            echo "更新 $VERSION_FILE 文件..."
            rm -f "$VERSION_FILE"
            for key in "${ordered_keys[@]}"; do
                echo "$key=${version_map[$key]}" >> "$VERSION_FILE"
            done
        fi

        # --- 8. 将信息写入环境变量，供后续步骤使用 ---
        echo "UPDATED_IMAGES=$UPDATED_IMAGES" >> $GITHUB_ENV
        echo "INVALID_IMAGES=$INVALID_IMAGES" >> $GITHUB_ENV

        echo "==== 同步完成，commit 之前磁盘空间 ===="
        df -hT /

    - name: Commit version file
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add version.txt
        if git diff --staged --quiet; then
            echo "没有需要提交的变更。"
        else
            if [ -n "$UPDATED_IMAGES" ] && [ -n "$INVALID_IMAGES" ]; then
                git commit -m "chore: update ${UPDATED_IMAGES}; invalid ${INVALID_IMAGES} [skip ci]"
            elif [ -n "$UPDATED_IMAGES" ]; then
                git commit -m "chore: update ${UPDATED_IMAGES} [skip ci]"
            else
                git commit -m "chore: update image versions [skip ci]"
            fi
            git push
        fi
        echo "==== Commit 完成，磁盘空间 ===="
        df -hT /
        # 退出码 0，保证失效镜像不会让整个 workflow 失败
        exit 0

    # ============================================================
    # 方案 A（兜底）：无论成功/失败都执行彻底清理
    # 必须显式清 buildx 和 containerd 残留，否则多跑几次磁盘必然爆。
    # ============================================================
    - name: Cleanup docker / buildx / containerd after run
      if: always()
      run: |
        echo "运行结束后彻底清理 docker / buildx / containerd 资源..."
        docker buildx rm --all-inactive 2>/dev/null || true
        docker buildx prune -af --all 2>/dev/null || true
        docker builder prune -af --all 2>/dev/null || true
        docker system prune -af --volumes 2>/dev/null || true
        if [ -d /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots ]; then
          sudo rm -rf /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/* 2>/dev/null || true
        fi
        if [ -d /var/lib/docker/buildkit ]; then
          sudo rm -rf /var/lib/docker/buildkit/* 2>/dev/null || true
        fi
        echo "=============================================================================="
        df -hT /
        echo "==== docker / containerd 目录占用 ===="
        sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true
        echo "=============================================================================="

  # ============================================================
  # 清理 30 天前的 Actions 运行记录
  # - 用 GitHub REST API：GET /repos/{owner}/{repo}/actions/runs
  #   ?status=completed&per_page=100&page=N，遍历分页拿全部 completed run，
  #   created_at 早于 30 天前的，DELETE /repos/{owner}/{repo}/actions/runs/{id}
  # - 只删 status=completed（success/failure/cancelled/skipped/timed_out），
  #   in_progress / queued / waiting / pending 一律不动。
  # - 删除失败不阻断主流程，仅打印告警。
  # - 当前 run 自己（GITHUB_RUN_ID）一定跳过。
  # - 需要 secrets.GITHUB_TOKEN，且 permissions.actions: write。
  # - 30 天阈值可由 env.RETENTION_DAYS 调整。
  # ============================================================
  cleanup-old-runs:
    name: Cleanup old workflow runs (>30d)
    runs-on: ubuntu-latest
    if: always()
    needs: build
    env:
      RETENTION_DAYS: "30"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete workflow runs older than RETENTION_DAYS
        run: |
          set -uo pipefail

          OWNER_REPO="${GH_REPO}"
          THRESHOLD_DATE=$(date -u -d "${RETENTION_DAYS} days ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "将删除 ${OWNER_REPO} 中 created_at < ${THRESHOLD_DATE} 的 completed runs"
          echo "当前 run (跳过): ${GITHUB_RUN_ID}"
          echo "=============================================================================="

          # 借助 gh CLI 遍历分页（一次性拿全 completed run，自动分页）
          # 只取 status=completed（success/failure/cancelled/skipped/timed_out），不碰 in_progress/queued。
          deleted=0
          skipped_running=0
          skipped_self=0
          failed=0

          # 用 gh api 流式分页拉取，避免一次性把全部 run 放内存
          page=1
          while :; do
            resp=$(gh api -X GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/${OWNER_REPO}/actions/runs?status=completed&per_page=100&page=${page}" \
              --paginate=false 2>/dev/null) || {
                echo ">>> gh api 拉取 page=${page} 失败，停止。"
                break
              }

            count=$(echo "$resp" | jq '.workflow_runs | length')
            if [ "$count" = "0" ] || [ -z "$count" ]; then
              echo "page=${page}: 无更多 runs，结束遍历。"
              break
            fi

            echo "page=${page}: 拿到 ${count} 条 completed run，开始判定..."

            # 把每条 run 的 id / created_at / name / status / conclusion / html_url 提取出来逐条处理
            echo "$resp" | jq -c '.workflow_runs[] | {id, name, status, conclusion, created_at, html_url}' | while read -r item; do
              run_id=$(echo "$item" | jq -r '.id')
              run_name=$(echo "$item" | jq -r '.name')
              run_status=$(echo "$item" | jq -r '.status')
              run_conclusion=$(echo "$item" | jq -r '.conclusion')
              run_created=$(echo "$item" | jq -r '.created_at')
              run_url=$(echo "$item" | jq -r '.html_url')

              # 跳过当前 run 自己
              if [ "$run_id" = "${GITHUB_RUN_ID}" ]; then
                echo "  [skip-self]  run_id=${run_id}  name=${run_name}"
                skipped_self=$((skipped_self+1))
                continue
              fi

              # status=completed 才会出现在结果里，这里只是再保险一道
              if [ "$run_status" != "completed" ]; then
                echo "  [skip-running] run_id=${run_id} status=${run_status} (不删正在跑的)"
                skipped_running=$((skipped_running+1))
                continue
              fi

              # created_at 早于阈值 -> 删除
              if [[ "$run_created" < "$THRESHOLD_DATE" ]]; then
                echo "  [delete] run_id=${run_id} name=${run_name} conclusion=${run_conclusion} created=${run_created}"
                if gh api -X DELETE "/repos/${OWNER_REPO}/actions/runs/${run_id}" >/dev/null 2>&1; then
                  echo "    -> 已删除"
                else
                  echo "    -> 删除失败（可能无权限或已被删）"
                fi
              else
                :  # 还在 30 天内，跳过
              fi
            done

            page=$((page+1))
            # GitHub API 分页上限 100 页，超过强制退出防止死循环
            if [ "$page" -gt 100 ]; then
              echo ">>> 已遍历 100 页，强制停止（如 run 数量异常多，请加大 per_page 或多次触发）。"
              break
            fi
          done

          echo "=============================================================================="
          echo "清理完成。"
          echo "=============================================================================="
